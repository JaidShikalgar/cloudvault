{% extends 'base.html' %}
{% block title %}Login — CloudVault{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-cloud"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to your CloudVault account</p>
        </div>
        
        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" name="email" 
                       placeholder="you@example.com" required
                       class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
<!-- login.html password field -->
<div class="password-wrapper">
    <input type="password"
           id="password"
           name="password"
           placeholder="Enter your password"
           required
           class="form-input">
    <button type="button"
            class="password-toggle"
            onclick="togglePassword('password')">
        <i class="fas fa-eye" id="password-eye"></i>
    </button>
</div>
            </div>
            
            <div class="form-group form-check">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Remember me for 30 days
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
       <div class="auth-footer">
            <p>
                <a href="{{ url_for('auth.forgot_password') }}"
                style="color: var(--text-muted); font-size: 0.85rem;">
                    <i class="fas fa-key"></i> Forgot your password?
                </a>
            </p>
            <p>
                Don't have an account?
                <a href="{{ url_for('auth.signup') }}">Create one free →</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
