{% extends 'base.html' %}
{% block title %}Reset Password — CloudVault{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo"
                 style="background: linear-gradient(135deg, #10b981, #059669);">
                <i class="fas fa-lock-open"></i>
            </div>
            <h1>Reset Password</h1>
            <p>Create a strong new password for your account.</p>
        </div>

        <form method="POST"
              action="{{ url_for('auth.reset_password', token=token) }}"
              class="auth-form">

            <div class="form-group">
                <label for="new_password">
                    <i class="fas fa-lock"></i> New Password
                </label>
                <div class="password-wrapper">
                    <input type="password"
                           id="new_password"
                           name="new_password"
                           placeholder="At least 6 characters"
                           required
                           minlength="6"
                           class="form-input"
                           autofocus>
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('new_password')">
                        <i class="fas fa-eye" id="new_password-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    <i class="fas fa-lock"></i> Confirm New Password
                </label>
                <div class="password-wrapper">
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="Repeat new password"
                           required
                           class="form-input">
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirm_password')">
                        <i class="fas fa-eye" id="confirm_password-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Password strength indicator -->
            <div class="password-strength" id="strengthBox">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <small id="strengthText">Enter a password</small>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-save"></i>
                Save New Password
            </button>

        </form>

        <div class="auth-footer">
            <p>
                <a href="{{ url_for('auth.login') }}">← Back to Login</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Password strength checker
const passInput = document.getElementById('new_password');
const fill      = document.getElementById('strengthFill');
const text      = document.getElementById('strengthText');

if (passInput) {
    passInput.addEventListener('input', () => {
        const val = passInput.value;
        let score = 0;

        if (val.length >= 6)  score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
            { pct: '0%',   color: 'transparent', label: 'Enter a password' },
            { pct: '25%',  color: '#ef4444',      label: '😟 Weak' },
            { pct: '50%',  color: '#f59e0b',      label: '😐 Fair' },
            { pct: '75%',  color: '#3b82f6',      label: '😊 Good' },
            { pct: '90%',  color: '#8b5cf6',      label: '💪 Strong' },
            { pct: '100%', color: '#10b981',      label: '🔥 Very Strong!' },
        ];

        const level = levels[Math.min(score, 5)];
        if (fill) {
            fill.style.width = level.pct;
            fill.style.background = level.color;
            fill.style.transition = 'all 0.3s ease';
        }
        if (text) {
            text.textContent = level.label;
            text.style.color = level.color;
        }
    });
}
</script>
{% endblock %}
